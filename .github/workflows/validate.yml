name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate each skill against the Agent Skills spec
        run: |
          status=0
          for dir in skills/*/; do
            pipx run --spec skills-ref==0.1.1 agentskills validate "$dir" || status=1
          done
          exit "$status"

      - name: Check the Claude Code plugin manifests are valid JSON
        run: |
          for file in .claude-plugin/*.json; do
            python3 -m json.tool "$file" > /dev/null || { echo "invalid JSON: $file"; exit 1; }
          done
